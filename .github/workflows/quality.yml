name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build test environment
        run: docker build -f deploy/test/Dockerfile -t moria-test:ci .
      - name: Verify repeatable bootstrap
        run: docker run --rm moria-test:ci bash -c 'bash .openhands/setup.sh && bash .openhands/setup.sh'
      - name: Preload pinned function test images
        run: |
          docker pull node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
          docker pull registry@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
      - name: Verify quality gate and completion hook offline as non-root
        run: |
          docker run --rm --network none \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            moria-test:ci bash .openhands/hooks/quality-gate.sh
