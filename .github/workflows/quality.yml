name: Quality
run-name: Hosted sandbox accounting diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build static test environment without native compilation
        run: docker build --target static-check -f deploy/test/Dockerfile -t moria-test:static .
      - name: Verify static quality offline
        run: docker run --rm --network none moria-test:static pnpm check:static
  linux:
    needs: static
    name: Linux quality
    runs-on: ubuntu-24.04
    # Cold compilation and the complete suite exceeded the old 45-minute job budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build test environment
        run: docker build -f deploy/test/Dockerfile -t moria-test:ci .
      - name: Verify repeatable bootstrap
        run: docker run --rm moria-test:ci bash -c 'bash .openhands/setup.sh && bash .openhands/setup.sh'
      - name: Report Docker client, daemon and accounting environment
        run: |
          docker version
          docker info --format '{{.CgroupDriver}} {{.CgroupVersion}} {{.KernelVersion}}'
      - name: Preload pinned sandbox test images
        run: |
          docker pull node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
          docker pull registry@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
          docker pull python:3.11-slim-bookworm@sha256:061c190f3d5815b341a18dfe8a45771f8ba68c15a607ea56997fde3009ac4eec
      - name: Reproduce Agent and Pipeline accounting under hosted Docker
        run: |
          sudo python3 deploy/test/run-quality.py moria-test:ci pnpm test:integration \
            tests/native-agents.integration.test.ts tests/native-pipelines.integration.test.ts
