name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build test environment
        run: docker build -f deploy/test/Dockerfile -t moria-test:ci .
      - name: Verify repeatable bootstrap
        run: docker run --rm moria-test:ci bash -c 'bash .openhands/setup.sh && bash .openhands/setup.sh'
      - name: Verify quality gate and completion hook offline as non-root
        run: docker run --rm --network none moria-test:ci bash .openhands/hooks/quality-gate.sh

  windows:
    name: Windows quality
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          npm install -g pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install -r workers/iceberg/requirements.txt -r requirements-dev.txt -r docs/spec/schemas/requirements.txt
          exit $LASTEXITCODE
      - name: Verify
        run: pnpm check
      - name: Check tracked source remains unchanged
        run: git diff --exit-code
