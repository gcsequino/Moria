name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality
    runs-on: ubuntu-24.04
    # Include cold native compilation as well as the complete offline gate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build test environment
        run: docker build -f deploy/test/Dockerfile -t moria-test:ci .
      - name: Verify repeatable bootstrap
        run: docker run --rm moria-test:ci bash -c 'bash .openhands/setup.sh && bash .openhands/setup.sh'
      - name: Report Docker client and daemon versions
        run: docker version
      - name: Preload pinned sandbox test images
        run: |
          docker pull node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
          docker pull registry@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
          docker pull python:3.11-slim-bookworm@sha256:061c190f3d5815b341a18dfe8a45771f8ba68c15a607ea56997fde3009ac4eec
      - name: Verify quality gate and completion hook offline as non-root
        run: |
          sudo python3 deploy/test/run-quality.py moria-test:ci
