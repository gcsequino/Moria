[package]
name = "moria-indexing"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
arrow-array = "58"
arrow-schema = "58"
bytes = "1"
chrono = "0.4"
deadpool-postgres = "0.14"
futures = "0.3"
iceberg = { version = "=0.10.1", default-features = false }
native-tls = "0.2"
postgres-native-tls = "0.5"
prost = "0.14"
rustix = { version = "1", features = ["fs"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["v4", "serde"] }
typetag = "0.2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
